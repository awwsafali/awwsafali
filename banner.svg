<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9">
        <animate attributeName="stop-color" values="#6D28D9;#06B6D4;#6D28D9" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#6D28D9;#06B6D4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="220" fill="url(#bgGrad)" />

  <!-- soft animated wave shapes -->
  <path fill="url(#wave1)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,160 C300,120 900,200 1200,150 L1200,220 L0,220 Z;
              M0,180 C300,220 900,120 1200,180 L1200,220 L0,220 Z;
              M0,160 C300,120 900,200 1200,150 L1200,220 L0,220 Z" />
  </path>
  <path fill="#ffffff" opacity="0.06">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,190 C400,150 800,210 1200,170 L1200,220 L0,220 Z;
              M0,170 C400,210 800,150 1200,190 L1200,220 L0,220 Z;
              M0,190 C400,150 800,210 1200,170 L1200,220 L0,220 Z" />
  </path>

  <!-- name -->
  <text x="600" y="105" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="58" font-weight="700" fill="#ffffff">
    Ausaf Ali
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" />
  </text>

  <!-- subtitle -->
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="22" fill="#E0E7FF">
    Full-Stack Developer &#183; Laravel &amp; React
    <animate attributeName="opacity" values="0;0;1" dur="2.2s" fill="freeze" />
  </text>
</svg>
